<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" fill="#1f4788"/>
  
  <!-- Calendar grid -->
  <g fill="none" stroke="#ffffff" stroke-width="2">
    <rect x="20" y="25" width="88" height="75" rx="3"/>
    <line x1="20" y1="40" x2="108" y2="40"/>
    <line x1="20" y1="55" x2="108" y2="55"/>
    <line x1="20" y1="70" x2="108" y2="70"/>
    <line x1="20" y1="85" x2="108" y2="85"/>
    <line x1="40" y1="25" x2="40" y2="100"/>
    <line x1="60" y1="25" x2="60" y2="100"/>
    <line x1="80" y1="25" x2="80" y2="100"/>
  </g>
  
  <!-- Status indicator (small circle) -->
  <circle cx="108" cy="18" r="8" fill="#ff9500"/>
  
  <!-- Arrow pointing down and right (automation symbol) -->
  <g fill="none" stroke="#ff9500" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 64 110 L 75 110 L 75 119 L 84 110 L 75 101 L 75 110 Z"/>
  </g>
  
  <!-- Dot indicator on calendar -->
  <circle cx="50" cy="48" r="4" fill="#4CAF50"/>
  <circle cx="70" cy="63" r="4" fill="#4CAF50"/>
  <circle cx="90" cy="78" r="4" fill="#4CAF50"/>
</svg>
